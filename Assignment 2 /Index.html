<!DOCTYPE html>
<html lang="en">
  <!--This is the header of the html code -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <link rel="stylesheet" href="Style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  </head>
<!--This is the body of the html code -->
<body>
  <div class="container">
    <div class="form-section">
      <h2>Login</h2>
      <div class="social-login">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
       </div>
       <p class="subtext">or use your account</p>
       <form>
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <a href="https://support.google.com/accounts/answer/41078?hl=en&co=GENIE.Platform%3DDesktop" target="_blank" class="forgot-link">Forgot your password?</a>
        <button type="submit">Log In</button>
       </form>
     </div>
     <div class="info-section">
      <h2>HTML CSS Login Form</h2>
      <p>This login form is created using pure HTML and CSS. For social icons, FontAwesome is used.</p>
    </div>
  </div>
</body>
</html>
