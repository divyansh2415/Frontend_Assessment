<!Doctype html>
<html>
    <!--This is the header Section of Html -->
    <head>
        
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather App </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <!--This is the Body Section of Html -->
    <body>
      <div class="card">
           <div class="search">
                <input type="type" placeholder="enter city name" spellchevk="false" >
                <button><img src="images/search.png"></button>
          </div>
          <div class="error">
            <p>Invalid City Name</p>
          </div>
              <div class="weather">
                 <img src="images/rain.png" class="weather-icon">
                 <h1 class="temp">22°c</h1>
                  <h2 class="city">New York</h2>
                  <div class="details">
                      <div class="col">
                          <img src="images/humidity.png" class="icon" alt="Humidity">
                               <div>
                                   <p class="humidity">50%</p>
                                   <p>Humidity</p>
                               </div>
                        </div>
                                 <div class="col">
                                      <img src="images/wind.png" class="icon" alt="Wind">
                                        <div>
                                            <p class="wind">15 Km/hr</p>
                                            <p>Wind Speed</p>
                                        </div>
                                   </div>
                    </div>
                 </div>
             </div>
     </div>
     <script src="script.js"></script>
    </body>
    </html>
